root = .
filter = (?:logerr|qlogerr)/(?:src|include)/
exclude = .*/date\.h
merge-lines = yes
exclude-unreachable-branches = yes
exclude-throw-branches = yes
print-summary = yes
# Parallel test execution (ctest -j) can leave a gcov branch counter momentarily reading a negative hit count, which
# gcov reports as e.g. "branch 1 taken -1 (fallthrough)". It is a benign instrumentation artifact, not a coverage
# regression, but it aborts the whole gcovr parse. Downgrade only that specific artifact to a warning; the real
# thresholds (--fail-under-line / --fail-under-branch) still enforce coverage.
gcov-ignore-parse-errors = negative_hits.warn
