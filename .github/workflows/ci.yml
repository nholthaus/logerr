name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / Qt=${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        qt: [true, false]

    steps:
      - uses: actions/checkout@v4

      # Linux stack-trace support needs libbfd (binutils); required for both Qt and non-Qt builds.
      - name: Install binutils (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils-dev libiberty-dev

      - name: Install Qt
        if: ${{ matrix.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          cache: true

      # logerr's CMake requires Qt6_DIR to be set explicitly when building with Qt.
      - name: Export Qt6_DIR
        if: ${{ matrix.qt }}
        shell: bash
        run: echo "Qt6_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT=${{ matrix.qt && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config Release
