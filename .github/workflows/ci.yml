name: ci

on:
  push:
    branches: [master]
    # A release tag runs the same build/test/coverage gates as master before the release job is allowed to publish it.
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / Qt=${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        qt: [true, false]

    steps:
      - uses: actions/checkout@v4

      # Linux stack-trace support needs libbfd (binutils); required for both Qt and non-Qt builds.
      - name: Install binutils (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils-dev libiberty-dev

      - name: Install Qt
        if: ${{ matrix.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          cache: true

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT=${{ matrix.qt && 'ON' || 'OFF' }} \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure -j

  coverage:
    name: Linux / Qt / coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build and coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-dev libiberty-dev

      # Ubuntu 24.04 ships gcovr 7.0, which predates merge-lines. Pin the report generator so template-instantiation
      # coverage is merged consistently with local builds and future runner-image package updates cannot change it.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install gcovr
        run: python -m pip install --disable-pip-version-check gcovr==8.6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          cache: true

      - name: Configure coverage build
        run: |
          cmake -S . -B build-coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_WITH_QT=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build and test
        run: |
          cmake --build build-coverage -j
          ctest --test-dir build-coverage --output-on-failure -j

      - name: Report and enforce coverage
        run: |
          gcovr build-coverage --config coverage.cfg \
            --html-details coverage.html \
            --xml-pretty --xml coverage.xml \
            --fail-under-line 90 \
            --fail-under-branch 70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logerr-coverage
          path: |
            coverage.html
            coverage.*.html
            coverage.xml

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate version and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to release non-semantic tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          # Make rerunning a successful release job harmless.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest
